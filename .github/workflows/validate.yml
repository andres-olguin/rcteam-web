name: Validate static site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate HTML references and structure
        run: python scripts/validate_site.py
      - name: Verify preview and production SEO separation
        run: python -m unittest discover -s tests -p 'test_seo.py' -v
